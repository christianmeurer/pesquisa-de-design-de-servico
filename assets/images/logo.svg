<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- Logomark: interconnected nodes representing research/service design network -->
  <g transform="translate(8, 8)">
    <!-- Connection lines -->
    <line x1="20" y1="32" x2="44" y2="16" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="44" y2="48" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="16" x2="44" y2="48" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Outer ring (research/magnifying glass abstraction) -->
    <circle cx="32" cy="32" r="28" stroke="#059669" stroke-width="2.5" fill="none"/>
    <line x1="52" y1="52" x2="62" y2="62" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

    <!-- Nodes -->
    <circle cx="20" cy="32" r="5" fill="#064e3b"/>
    <circle cx="44" cy="16" r="5" fill="#059669"/>
    <circle cx="44" cy="48" r="5" fill="#10b981"/>

    <!-- Center dot -->
    <circle cx="34" cy="32" r="2.5" fill="#34d399"/>
  </g>

  <!-- Logotype -->
  <text x="82" y="36" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#022c22" letter-spacing="-0.02em">
    Pesquisa Design
  </text>
  <text x="82" y="60" font-family="'DM Sans', system-ui, sans-serif" font-size="14" fill="#059669" font-weight="500" letter-spacing="0.08em">
    DE SERVIÇO NO BRASIL
  </text>
</svg>
