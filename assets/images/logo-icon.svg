<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Logomark: interconnected nodes inside research lens -->
  <!-- Connection lines -->
  <line x1="20" y1="30" x2="38" y2="17" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="38" y2="43" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="17" x2="38" y2="43" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Outer ring -->
  <circle cx="28" cy="28" r="24" stroke="#059669" stroke-width="2.5" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="45" y1="45" x2="58" y2="58" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="20" cy="30" r="4.5" fill="#064e3b"/>
  <circle cx="38" cy="17" r="4.5" fill="#059669"/>
  <circle cx="38" cy="43" r="4.5" fill="#10b981"/>

  <!-- Center dot -->
  <circle cx="30" cy="30" r="2.2" fill="#34d399"/>
</svg>
